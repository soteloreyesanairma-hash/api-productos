<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <style>
    *{
      padding: 0px;
      margin: 0px;
      border: 0px;
      font: Arial, Helvetica, sans-serif;
      font-weight: normal;
    }

    .contenedor{
      width: 90%;
      margin: 0 auto;
      background-color: rgb(16, 155, 173);
      padding: .5rem;
      text-align: center;
    }

    .tarjeta{
      padding: 1rem;
      width: 350px;
      background-color: rgba(12, 230, 219, 0.87);
      display: inline-block;
      border-radius: 10px;
      margin-bottom: .25rem;
    }

    .tarejta a{
      text-decoration: none;
      font-size: 12px;
    }

    .tarejta a:hover{
      text-decoration: underline;
    }
    
    .tarjeta h5{
      font-style: italic;
      margin-bottom: .25rem;
    }
  </style>

  <select name="selector-carreras" id="selector-carreras" class="select">
    <option value="">Mostrar todas</option>
    <option value="Ingeneria de Software">Ingeneria de Software</option>
    <option value="Diseño Grafico Digital">Diseño Grafico Digital</option>
    <option value="Administracion Industrial">Administracion Industrial</option>
  </select>

  <div class="contenedor">
    <!-- Dinamico -->
  </div>

  <script>
    /* Imaginemos que los datos para las tarjetas vienen en una consulta */
    /* con esta informacion ¿Como las remplazamos? */
    const alumnos = [
      {
        apellidos: "De La Cruz Sotelo",
        nombres: "Jesus Rodrigo",
        carrera: "Ingeneria de Software",
        telefonos: "934155450",
        correo: "rodrigosotelo@gmail.com"
      },
      {
        apellidos: "Martinez Crisostomo",
        nombres: "Margarita",
        carrera: "Diseño Grafico Digital",
        telefonos: "999555666",
        correo: "margarita@gmail.com"
      },
      {
        apellidos: "Flores Atuncar",
        nombres: "Arturo Jose",
        carrera: "Administracion Industrial",
        telefonos: "956444777",
        correo: "arturo@gmail.com"
      },
      {
        apellidos: "Peñaloza Perez",
        nombres: "Carlos",
        carrera: "Ingeneria de Software",
        telefonos: "955889056",
        correo: "carlos@gmail.com"
      },
      {
        apellidos: "Quintana Perea",
        nombres: "Flor Katherine",
        carrera: "Diseño Grafico Digital",
        telefonos: "965777000",
        correo: "flor@gmail.com"
      },
    ]

    const contenedor = document.querySelector(".contenedor") //. = clase
    const selector = document.getElementById('selector-carreras')

    //Evento (¿Cuando ejecutamos la instruccion?)
    selector.addEventListener("change", function(){
      renderizarTarjetas(selector.value)
    })

    //Continuamos...
    //Manejo de DOM
    //Esta funcion requiere el nombre de una carrera (opcional), aplicar
    //el filtro con el nombre de la carrera, en caso este vacia, mostrar todo 
    function renderizarTarjetas(carrera = ""){
      let listafiltrada = []
      contenedor.innerHTML = ''

      //Operador terniario
      listafiltrada =
        carrera.trim() === ""
        ? alumnos
        : alumnos.filter(alumno => alumno.carrera == carrera)

      //Paso 1 - Recorrer un arreglo
      listafiltrada.forEach(alumno => {
        const nuevaTarjeta = `
        <div class="tarjeta">
          <h4>${alumno.apellidos} ${alumno.nombres}</h4>
          <h5>${alumno.carrera}</h5>
          <a href="tel:${alumno.telefonos}">Contacto</a>
          <a href="mailto:${alumno.correo}">Enviar correo</a>
        </div>
        `
        contenedor.innerHTML += nuevaTarjeta
      });
    }
    
    renderizarTarjetas()
  </script>
</body>
</html>
